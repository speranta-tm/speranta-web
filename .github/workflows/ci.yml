name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Bun from the npm registry rather than oven-sh/setup-bun: that action
      # downloads from GitHub releases, which kept answering 504 and failing the
      # job before anything ran. Node (and npm) come with the runner image.
      - name: Install Bun
        run: npm install --global bun@1.4.2 && bun --version

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # tsc runs as part of build (`tsc -b && vite build`), so a type error fails here too.
      - name: Build
        run: bun run build
